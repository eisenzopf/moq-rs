name: pr

on:
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v5

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Install Rust with clippy/rustfmt
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      # Keep the dependency-light admission API independently buildable.
      - run: cargo check -p moq-relay-ietf --no-default-features
      - run: cargo test -p moq-relay-ietf --no-default-features
      - name: Reject relay HTTP runtime dependencies from admission-only builds
        run: |
          if cargo tree -p moq-relay-ietf --no-default-features -e normal | grep -Eq '(^| )((axum|hyper-serve|hyper-util) v)'; then
            echo "admission-only build unexpectedly contains the relay HTTP runtime"
            exit 1
          fi
      - run: cargo check -p moq-relay-ietf --all-features
      - run: cargo test -p moq-relay-ietf --all-features

      # Make sure u guys don't write bad code
      - run: cargo test --verbose
      - run: cargo clippy --no-deps
      - run: cargo fmt --check

      # Check for unused dependencies
      - uses: bnjbvr/cargo-machete@main
